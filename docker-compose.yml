version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: presence-postgres
    restart: always
    environment:
      POSTGRES_USER: presence_user
      POSTGRES_PASSWORD: presence_password
      POSTGRES_DB: presence_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presence_user -d presence_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
